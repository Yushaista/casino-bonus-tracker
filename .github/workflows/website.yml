name: Test and refresh casino bonuses

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '18 5 * * *'

permissions:
  contents: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test parser and safety behavior
        run: python -m unittest discover -s tests -v
      - name: Validate browser JavaScript syntax
        run: node --check assets/app.js
      - name: Scrape live terms and structure with a local language model
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[scrape]')
        run: python -m scraper.scrape
      - name: Commit validated JSON
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[scrape]')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bonuses.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update source-validated records [scrape]'
            git push
          fi
